name: CI

on:
  push:
  pull_request:

jobs:
  repo-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scaffold validation
        run: python3 scripts/validate_scaffold.py
      - name: OQ update rule check
        run: python3 scripts/check_oq_updates.py
      - name: Doc link check
        run: python3 scripts/check_doc_links.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: target/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: target/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format -- --check
