[project]
name = "app"
version = "0.1.0"
description = "Migration target backend (FastAPI skeleton, no business logic)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.10.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
strict = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture: each layer may depend only on layers below it (app.platform -> api -> services -> repositories -> domain); skipping layers is allowed, upward deps are not"
type = "layers"
layers = [
    "app.platform",
    "app.api",
    "app.services",
    "app.repositories",
    "app.domain",
]

# Platform adapter boundary guard (S-008/ADR-0005, amended post-review;
# docs/04 "Design rule"; RULEBOOK Platform/DLL #1-#2). Belt-and-braces with
# the layers contract above: app.platform sits above api/services/
# repositories/domain in the layers contract (so none of them may import it,
# including indirectly), and this contract additionally restricts
# app.platform's own reach into core — the adapter must go through
# app.services like any other caller, not reach past it into
# app.repositories directly. app.domain (shared value types) stays allowed
# from app.platform since those are non-behavioral. If either contract
# fails, platform/host dependency has leaked into or through core in a way
# this boundary was meant to prevent.
[[tool.importlinter.contracts]]
name = "Platform isolation: core layers (api, services, repositories, domain) must not import app.platform — a violation means platform dependency leaked into core"
type = "forbidden"
source_modules = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.domain",
]
forbidden_modules = [
    "app.platform",
]

[[tool.importlinter.contracts]]
name = "Platform adapter must route through app.services, not reach directly into app.repositories"
type = "forbidden"
source_modules = [
    "app.platform",
]
forbidden_modules = [
    "app.repositories",
]

# Composition-root exemption guard: app.main is deliberately outside the
# contracts above (something must wire the adapter when one exists), but
# that exemption must not turn app.main into a utility hub other modules
# import from. Nothing may import app.main; it stays a leaf.
[[tool.importlinter.contracts]]
name = "Composition root isolation: nothing may import app.main — it stays a leaf, not a utility hub"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.api",
    "app.services",
    "app.repositories",
    "app.domain",
]
forbidden_modules = [
    "app.main",
]
